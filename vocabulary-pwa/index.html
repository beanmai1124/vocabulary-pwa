<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="單字卡"><title>單字複習</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><small>SPACED REPETITION</small><h1>單字複習</h1></div><span id="network">檢查連線中</span></header><section class="toolbar"><label class="button">匯入 CSV<input id="csvInput" type="file" accept=".csv,text/csv" hidden></label><button id="exportCsv" class="secondary">匯出 CSV</button><button id="exportBackup" class="secondary">備份 JSON</button><label class="button secondary">還原備份<input id="backupInput" type="file" accept=".json" hidden></label><select id="category"><option value="all">全部分類</option></select></section><section class="summary"><div><b id="dueCount">0</b><span>今日待複習</span></div><div><b id="passTotal">0</b><span>Pass</span></div><div><b id="failTotal">0</b><span>Fail</span></div></section><section id="card" class="card" tabindex="0"><div id="front"><p id="meta">尚未匯入</p><h2 id="english">請匯入 CSV</h2><button id="speak" class="speak">🔊</button><p class="muted">點卡片查看答案</p></div><div id="back" hidden><h3 id="chinese"></h3><p id="example"></p><p id="exampleZh"></p></div></section><section class="counts"><span>Pass：<b id="wordPass">0</b></span><span>Fail：<b id="wordFail">0</b></span><span>下次：<b id="nextReview">-</b></span></section><section class="actions"><button id="fail" class="fail">Fail</button><button id="pass" class="pass">Pass</button></section><section class="nav"><button id="prev" class="secondary">上一個</button><button id="random" class="secondary">隨機</button><button id="next" class="secondary">下一個</button></section><p id="status"></p></main><script src="app.js"></script></body></html>
