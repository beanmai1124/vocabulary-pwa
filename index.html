<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="單字複習"><title>單字複習</title><link rel="manifest" href="./manifest.webmanifest?v=7"><link rel="apple-touch-icon" href="./icons/icon-192.png?v=7"><link rel="stylesheet" href="./style.css?v=7"></head><body><main class="app"><header><div><small>SPACED REPETITION</small><h1>單字複習</h1></div><span id="network">檢查中</span></header><section class="toolbar"><label class="button">匯入 CSV<input id="csvInput" type="file" accept=".csv,text/csv,text/plain" hidden></label><button id="exportCsv" class="secondary" type="button">匯出 CSV</button><select id="category"><option value="all">全部分類</option></select></section><section class="summary"><div><b id="dueCount">0</b><span>今日待複習</span></div><div><b id="passTotal">0</b><span>Pass</span></div><div><b id="failTotal">0</b><span>Fail</span></div></section><section id="card" class="card" tabindex="0" role="button"><div id="front"><p id="meta">尚未匯入</p><p id="questionType" class="question-type"></p><h2 id="question">請匯入 CSV</h2><button id="speak" class="speak" type="button">🔊</button><p class="muted">點卡片查看答案</p></div><div id="back" hidden><p id="answerType" class="question-type"></p><h3 id="answer"></h3><p id="example"></p><p id="exampleZh"></p></div></section><section class="counts"><span>Pass：<b id="wordPass">0</b></span><span>Fail：<b id="wordFail">0</b></span><span>下次：<b id="nextReview">-</b></span></section><section class="actions"><button id="fail" class="fail">Fail</button><button id="pass" class="pass">Pass</button></section><section class="nav"><button id="prev" class="secondary">上一個</button><button id="random" class="secondary">隨機</button><button id="next" class="secondary">下一個</button></section><p id="status" class="status">程式載入中...</p></main><script src="./app.js?v=7" defer></script></body></html>
